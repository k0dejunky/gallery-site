# Rotate the gallery application logs (backup, cron, workers, error log).
# Drop this file at /etc/logrotate.d/gallery (install.sh does it).
/var/www/gallery/storage/logs/*.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

# The slow-query / sql log is capped by the app itself; nothing needed here.