# Apache probe-scanner jail.
#
# Install to /etc/fail2ban/jail.d/gallery-apache-probes.conf and reload:
#   sudo install -o root -g root -m 644 config/fail2ban-gallery-apache-probes.conf \
#       /etc/fail2ban/jail.d/gallery-apache-probes.conf
#   sudo fail2ban-client reload
#
# The filter matches 4xx/5xx responses to .env / .git / wp-login / xmlrpc /
# adminer / phpmyadmin / cgi-bin / path-traversal probes. The DEFAULT
# banaction is nftables (defaults-debian.conf); the ufw REJECT rules that
# still mention "apache-probes" on older boxes are leftovers from the old
# ufw action.
[apache-probes]
enabled  = true
filter   = apache-probes
backend  = polling
logpath  = /var/log/apache2/access.log
           /var/log/apache2/access_ssl.log
port     = http,https
maxretry = 6
findtime = 600
bantime  = 3600
