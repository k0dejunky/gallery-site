Alias /gallery /var/www/gallery/public

# Live streaming: proxy MediaMTX HLS (mpegts) under /gallery/live/hls/.
ProxyPass /gallery/live/hls http://127.0.0.1:8888
ProxyPassReverse /gallery/live/hls http://127.0.0.1:8888

<Directory /var/www/gallery/public>
	Options -Indexes
	AllowOverride All
	Require all granted

	XSendFile On
	XSendFilePath /var/www/gallery/storage/uploads
	CGIPassAuth On
	XSendFilePath /var/www/gallery/storage
	XSendFilePath /var/www/gallery/public/assets/apk
</Directory>

<LocationMatch "^/gallery/(assets|favicon)">
	ExpiresActive On
	ExpiresByType image/png "access plus 30 days"
	ExpiresByType image/jpeg "access plus 30 days"
	ExpiresByType image/webp "access plus 30 days"
	ExpiresByType image/gif "access plus 30 days"
	ExpiresByType text/css "access plus 1 year"
	ExpiresByType application/javascript "access plus 1 year"
	ExpiresByType text/javascript "access plus 1 year"
	# All css/js under /assets are ?v=-versioned (bumped on any change), so they
	# can be cached immutably for a year without staleness risk.
	Header append Cache-Control "public, immutable"
</LocationMatch>

# SSE: stream chat updates without gzip buffering.
<LocationMatch "^/gallery/(chat/stream|webhooks/chat/stream|live/chat/stream)">
	SetEnv no-gzip 1
	Header unset Content-Encoding
</LocationMatch>