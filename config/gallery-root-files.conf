# The files a crawler expects at the ORIGIN ROOT.
#
# robots.txt is honoured ONLY at the host root, never under the app's
# base path - so https://host/gallery/robots.txt is a no-op and the real
# one has to be served from https://host/robots.txt. Without this the
# whole file, including its Sitemap: line, is ignored.
Alias /robots.txt /var/www/gallery/public/robots.txt

# The root sitemap path, so a tool that submits https://host/sitemap.xml
# finds the map. The map is written out as a file (bin/write_sitemap.php,
# every day) and served straight from disk, so a crawler does not have to
# wait on the application for it. The URLs inside it are absolute and point
# at the app, so the map is the same wherever it is fetched from.
Alias /sitemap.xml /var/www/gallery/public/sitemap.xml
Alias /videositemap.xml /var/www/gallery/public/videositemap.xml

# Apache's default pages must not be served. "Apache2 Ubuntu Default
# Page - It works" at the domain root of an adult site is an indexable
# boilerplate page, and /index.html reached it even though "/" is
# redirected to the app.
RedirectMatch 301 ^/index\.(html|htm|php)$ /gallery/
