Alias /gallery /var/www/gallery/public

# Live streaming: proxy MediaMTX HLS (mpegts) under /gallery/live/hls/.
ProxyPass /gallery/live/hls http://127.0.0.1:8888
ProxyPassReverse /gallery/live/hls http://127.0.0.1:8888

<Directory /var/www/gallery/public>
	Options -Indexes
	AllowOverride All
	Require all granted

	XSendFile On
	CGIPassAuth On
	# ONLY the two trees the app actually hands to mod_xsendfile: the
	# published media and the operator APK. The whole storage/ tree used to
	# be here, which also made the error log, the cron log, the database
	# backups and the rate-limit state reachable by an X-Sendfile header.
	XSendFilePath /var/www/gallery/storage/uploads
	XSendFilePath /var/www/gallery/public/assets/apk
</Directory>

<LocationMatch "^/gallery/(?!assets/apk/operator-chat-version\.json$)(assets|favicon)">
	ExpiresActive On
	ExpiresByType image/png "access plus 30 days"
	ExpiresByType image/jpeg "access plus 30 days"
	ExpiresByType image/webp "access plus 30 days"
	ExpiresByType image/gif "access plus 30 days"
	ExpiresByType text/css "access plus 1 year"
	ExpiresByType application/javascript "access plus 1 year"
	ExpiresByType text/javascript "access plus 1 year"
	# All css/js under /assets are ?v=-versioned (bumped on any change), so they
	# can be cached immutably for a year without staleness risk. The operator
	# APK is versioned in its file name too (OperatorChat-v3.1.apk).
	Header append Cache-Control "public, immutable"
</LocationMatch>

# The operator app's version manifest is the ONE file under /assets that is
# NOT versioned: it always says "here is the newest build". It used to be
# served with the immutable caching of the block above, so a client that
# fetched it once would never see the next release - and the app's automatic
# update would never arrive. It is never cached.
<LocationMatch "^/gallery/assets/apk/operator-chat-version\.json$">
	# ExpiresActive is off so mod_expires does not add "public" to the
	# Cache-Control - a shared cache must not keep it either.
	ExpiresActive Off
	Header unset Cache-Control
	Header unset Expires
	Header set Cache-Control "no-store, no-cache, must-revalidate"
	Header set Pragma "no-cache"
</LocationMatch>

# SSE: stream chat updates without gzip buffering.
<LocationMatch "^/gallery/(chat/stream|webhooks/chat/stream|live/chat/stream)">
	SetEnv no-gzip 1
	Header unset Content-Encoding
</LocationMatch>