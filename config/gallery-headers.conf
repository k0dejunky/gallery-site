# gallery-headers.conf — security headers for the gallery site
# NOTE: CSP uses real single quotes; escaped sequences (\x27) break parsing
# and make browsers treat source lists as empty -> blocks ALL css/js.
# style-src/script-src need 'unsafe-inline' because views embed
# per-page <style> blocks and the theme editor injects inline <script>.
# Braintree domains added for payment card fields + PayPal checkout.

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-site"
    # HSTS: honored only over HTTPS (browsers ignore it on cleartext HTTP, so
    # the dev host over HTTP is unaffected). Prod is HTTPS-only, so once a
    # browser sees this it will force HTTPS for a year.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    # CSP is emitted per-request by public/index.php (it needs the per-request
    # script nonce, which a static header cannot compute). Removing it here so
    # Apache does not layer a weaker, unsafe-inline policy on top.
</IfModule>
