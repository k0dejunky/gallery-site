# gallery-ip-redirect - the bare server IP is not a canonical origin.
#
# http://40.160.136.132/gallery/ and https://40.160.136.132/gallery/ both
# answered 200 with the whole site, which gives a crawler a second origin
# for the same pages and logs a ModSecurity "numeric IP host" warning on
# every hit. This block sends the IP to the real host.
#
# IMPORTANT: mod_rewrite directives in the SERVER context are NOT inherited
# by virtual hosts (RewriteEngine is per-vhost), so this cannot live in
# conf-enabled/gallery-root-files.conf - it must be pasted INSIDE each
# <VirtualHost> that can answer the IP (the :80 default vhost and the :443
# TLS vhost). install.sh inserts it into the distro default vhost; the
# production vhosts carry the same block.
#
# The rule matches the HOST, so every path moves (including /robots.txt).
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^40\.160\.136\.132(:[0-9]+)?$ [NC]
    RewriteRule ^ https://amethyst2213.com/gallery/ [R=301,L]
</IfModule>
