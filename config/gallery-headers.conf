# gallery-headers.conf — security headers for the gallery site
# NOTE: CSP uses real single quotes; escaped sequences (\x27) break parsing
# and make browsers treat source lists as empty -> blocks ALL css/js.
# style-src/script-src need 'unsafe-inline' because views embed
# per-page <style> blocks and the theme editor injects inline <script>.
# Braintree domains added for payment card fields + PayPal checkout.

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://js.braintreegateway.com; font-src 'self' data: https://assets.braintreegateway.com; media-src 'self' blob:; connect-src 'self' https://api.braintreegateway.com; frame-src 'self' https://client-analytics.braintreegateway.com https://www.sandbox.paypal.com https://www.paypal.com; frame-ancestors 'self'"
</IfModule>
